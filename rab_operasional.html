<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Suplier</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; }
        .card { border: 1px solid #e2e8f0; border-radius: 0.5rem; }
        .readonly-locked { background-color: #e9ecef !important; cursor: not-allowed; }
    </style>
</head>
<body class="p-4">

    <!-- Header Halaman & Tombol Aksi -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">Data Master Suplier</h4>
            <p class="text-muted small mb-0">Kelola data mitra suplier, alamat, dan informasi rekening bank</p>
        </div>
        <div>
            <!-- Tombol Duplikasi Suplier -->
            <button class="btn btn-outline-success btn-sm me-2" id="btnDuplikasi" onclick="duplikasiSuplier()" disabled>
                <i class="bi bi-files me-1"></i> Duplikasi Suplier
            </button>
            <!-- Tombol Hapus Masal (Soft Delete) -->
            <button class="btn btn-outline-danger btn-sm me-2" id="btnHapusMasal" onclick="hapusDataMasal()" disabled>
                <i class="bi bi-trash3 me-1"></i> Hapus Terpilih (<span id="countTerpilih">0</span>)
            </button>
            <!-- Tombol Tambah Suplier -->
            <button class="btn btn-primary btn-sm" onclick="bukaModalTambah()">
                <i class="bi bi-plus-lg me-1"></i> Tambah Suplier
            </button>
        </div>
    </div>

    <!-- KOTAK DEBUGGER / PESAN ERROR -->
    <div id="debug-alert" class="alert alert-danger d-none mb-3 small" role="alert">
        <strong>Peringatan Sistem:</strong> <span id="debug-message"></span>
    </div>

    <!-- Kotak Pencarian & Filter Bar -->
    <div class="card shadow-sm bg-white mb-3">
        <div class="card-body py-3">
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="inputPencarian" placeholder="Cari berdasarkan nama suplier atau ID suplier..." onkeyup="filterDataSuplier()">
                <button class="btn btn-outline-secondary" type="button" onclick="resetPencarian()">Reset</button>
            </div>
        </div>
    </div>

    <!-- Tabel Data Suplier -->
    <div class="card shadow-sm bg-white">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle small">
                    <thead class="table-light">
                        <tr>
                            <th width="40" class="text-center">
                                <input type="checkbox" class="form-check-input" id="checkAll" onclick="pilihSemuaBaris(this)">
                            </th>
                            <th>No</th>
                            <th>ID Suplier</th>
                            <th>ID SPPG</th>
                            <th>Nama Suplier (Klik untuk Edit)</th>
                            <th>Kontak / Telp</th>
                            <th>Wilayah / Alamat</th>
                            <th>Info Rekening Bank</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableSuplierBody">
                        <tr>
                            <td colspan="9" class="text-center text-muted py-4">Memuat data dari database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL FORM (TAMBAH / EDIT / DUPLIKASI SUPLIER) -->
    <div class="modal fade" id="modalFormSuplier" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold fs-6" id="modalTitle"><i class="bi bi-shop me-2 text-primary"></i>Tambah Master Suplier Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formSuplier">
                        <div class="row g-3">
                            <!-- Identitas -->
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">ID Suplier (Otomatis)</label>
                                <input type="text" class="form-control form-control-sm bg-light" id="idsuplier" readonly required placeholder="Auto Generated">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">ID SPPG</label>
                                <input type="text" class="form-control form-control-sm" id="idsppg" placeholder="ID SPPG Terkait" required>
                                <small class="text-muted" id="infoIdsppg" style="font-size: 10px; display: none;">Terkunci sesuai akun Anda</small>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">Nama Suplier</label>
                                <input type="text" class="form-control form-control-sm" id="namasuplier" required placeholder="Nama Toko / CV / PT">
                            </div>

                            <!-- Alamat & Wilayah -->
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Alamat</label>
                                <input type="text" class="form-control form-control-sm" id="alamat" placeholder="Alamat singkat">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Alamat Lengkap</label>
                                <textarea class="form-control form-control-sm" id="alamatlengkap" rows="2" placeholder="Alamat lengkap lokasi suplier"></textarea>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Desa</label>
                                <input type="text" class="form-control form-control-sm" id="desa">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Kecamatan</label>
                                <input type="text" class="form-control form-control-sm" id="kecamatan">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Kabupaten</label>
                                <input type="text" class="form-control form-control-sm" id="kabupaten">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Propinsi</label>
                                <input type="text" class="form-control form-control-sm" id="propinsi">
                            </div>

                            <!-- Kontak & Perbankan -->
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">No. Telepon</label>
                                <input type="text" class="form-control form-control-sm" id="nomortelp">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Nama Bank</label>
                                <input type="text" class="form-control form-control-sm" id="namabank" placeholder="BCA / Mandiri / dll">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Nomor Rekening</label>
                                <input type="text" class="form-control form-control-sm" id="nomorrekening" placeholder="Input nomor rekening baru">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Nama di Rekening</label>
                                <input type="text" class="form-control form-control-sm" id="namadirekening">
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary btn-sm" id="btnSimpanSuplier">Simpan Data</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- CDN JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Panggil File Supabase JS Terpusat -->
    <script src="js/supabase.js"></script>

    <script>
        let semuaDataSuplier = [];
        let currentUserIdsppg = null;
        let isSuperAdmin = false;
        let currentUserNama = 'System';
        let modalFormInstance = null;
        let isEditMode = false;

        function showDebug(msg) {
            const alertBox = document.getElementById('debug-alert');
            const msgSpan = document.getElementById('debug-message');
            msgSpan.textContent = msg;
            alertBox.classList.remove('d-none');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            modalFormInstance = new bootstrap.Modal(document.getElementById('modalFormSuplier'));
            await cekUser();
            await fetchSuplierData();
        });

        // Cek Sesi User
        async function cekUser() {
            try {
                let localUser = null;
                try {
                    localUser = JSON.parse(sessionStorage.getItem('sppg_user') || 'null');
                } catch(err) {}

                if (!localUser && window.parent && window.parent.sessionStorage) {
                    try {
                        localUser = JSON.parse(window.parent.sessionStorage.getItem('sppg_user') || 'null');
                    } catch(err) {}
                }

                if (!localUser) {
                    try {
                        localUser = JSON.parse(localStorage.getItem('sppg_user') || 'null');
                    } catch(err) {}
                }

                if (localUser) {
                    currentUserIdsppg = localUser.idsppg;
                    currentUserNama = localUser.nama_petugas || localUser.username || 'System';
                    
                    const role = String(localUser.role_access || '').toLowerCase();
                    const jabatan = String(localUser.jabatan || '').toLowerCase();
                    const email = String(localUser.username || localUser.email || '').toLowerCase();
                    
                    isSuperAdmin = role === 'superadmin' || role === 'admin' || role === 'editor' || jabatan.includes('super') || email === 'haaziqnawraalfatih@gmail.com';

                    if (!isSuperAdmin && !currentUserIdsppg && (localUser.email || localUser.username)) {
                        const targetEmail = localUser.email || localUser.username;
                        const { data: userData } = await _supabase
                            .from('users_login')
                            .select('idsppg')
                            .eq('username', targetEmail)
                            .maybeSingle();
                        
                        if (userData && userData.idsppg) {
                            currentUserIdsppg = userData.idsppg;
                            localUser.idsppg = userData.idsppg;
                            sessionStorage.setItem('sppg_user', JSON.stringify(localUser));
                        }
                    }
                }
            } catch (err) {
                console.error('Gagal membaca sesi user:', err);
            }
        }

        // Generate ID Suplier Angka Bulat Otomatis (+1 dari terbesar)
        async function generateIdSuplier() {
            const { data, error } = await _supabase
                .from('master_suplier')
                .select('idsuplier');

            let maxId = 0;
            if (!error && data && data.length > 0) {
                data.forEach(item => {
                    const parsed = parseInt(item.idsuplier);
                    if (!isNaN(parsed) && parsed > maxId) {
                        maxId = parsed;
                    }
                });
            }
            document.getElementById('idsuplier').value = maxId + 1;
        }

        // Buka Modal Tambah Suplier
        async function bukaModalTambah() {
            isEditMode = false;
            document.getElementById('formSuplier').reset();
            document.getElementById('modalTitle').innerHTML = '<i class="bi bi-shop me-2 text-primary"></i>Tambah Master Suplier Baru';
            document.getElementById('btnSimpanSuplier').textContent = 'Simpan Data';

            await generateIdSuplier();

            if (!isSuperAdmin && currentUserIdsppg) {
                const inputIdsppg = document.getElementById('idsppg');
                inputIdsppg.value = currentUserIdsppg;
                inputIdsppg.readOnly = true;
                inputIdsppg.classList.add('readonly-locked');
                document.getElementById('infoIdsppg').style.display = 'block';
            } else {
                const inputIdsppg = document.getElementById('idsppg');
                inputIdsppg.readOnly = false;
                inputIdsppg.classList.remove('readonly-locked');
                document.getElementById('infoIdsppg').style.display = 'none';
            }

            modalFormInstance.show();
        }

        // Buka Modal Edit Suplier
        function bukaModalEdit(idsuplierStr) {
            isEditMode = true;
            const item = semuaDataSuplier.find(d => String(d.idsuplier) === String(idsuplierStr));
            if (!item) return;

            document.getElementById('modalTitle').innerHTML = '<i class="bi bi-pencil-square me-2 text-primary"></i>Edit Master Suplier';
            document.getElementById('btnSimpanSuplier').textContent = 'Perbarui Data';

            document.getElementById('idsuplier').value = item.idsuplier || '';
            document.getElementById('idsppg').value = item.idsppg || item.id_sppg || item.IDSppg || '';
            document.getElementById('namasuplier').value = item.namasuplier || '';
            document.getElementById('alamat').value = item.alamat || '';
            document.getElementById('alamatlengkap').value = item.alamatlengkap || '';
            document.getElementById('desa').value = item.desa || '';
            document.getElementById('kecamatan').value = item.kecamatan || '';
            document.getElementById('kabupaten').value = item.kabupaten || '';
            document.getElementById('propinsi').value = item.propinsi || '';
            document.getElementById('nomortelp').value = item.nomortelp || '';
            document.getElementById('namabank').value = item.namabank || '';
            document.getElementById('nomorrekening').value = item.nomorrekening || '';
            document.getElementById('namadirekening').value = item.namadirekening || '';

            if (!isSuperAdmin && currentUserIdsppg) {
                const inputIdsppg = document.getElementById('idsppg');
                inputIdsppg.readOnly = true;
                inputIdsppg.classList.add('readonly-locked');
                document.getElementById('infoIdsppg').style.display = 'block';
            } else {
                const inputIdsppg = document.getElementById('idsppg');
                inputIdsppg.readOnly = false;
                inputIdsppg.classList.remove('readonly-locked');
                document.getElementById('infoIdsppg').style.display = 'none';
            }

            modalFormInstance.show();
        }

        // Fitur Duplikasi Suplier Terpilih
        async function duplikasiSuplier() {
            const checkedBoxes = document.querySelectorAll('.check-item:checked');
            
            if (checkedBoxes.length === 0) {
                alert('Silakan centang satu suplier yang ingin diduplikasi.');
                return;
            }
            if (checkedBoxes.length > 1) {
                alert('Peringatan: Anda memilih lebih dari 1 suplier! Harap pilih hanya 1 suplier saja untuk diduplikasi.');
                return;
            }

            const selectedIdStr = checkedBoxes[0].value;
            const item = semuaDataSuplier.find(d => String(d.idsuplier) === String(selectedIdStr));

            if (!item) {
                alert('Data suplier tidak ditemukan.');
                return;
            }

            isEditMode = false; // Mode Tambah Data Baru
            document.getElementById('formSuplier').reset();
            document.getElementById('modalTitle').innerHTML = '<i class="bi bi-files me-2 text-success"></i>Duplikasi Master Suplier (Input No. Rekening Baru)';
            document.getElementById('btnSimpanSuplier').textContent = 'Simpan Data Baru';

            // Generate ID Suplier Baru (Bilangan Bulat Otomatis)
            await generateIdSuplier();

            // Copy Data Lama
            document.getElementById('idsppg').value = item.idsppg || item.id_sppg || item.IDSppg || '';
            document.getElementById('namasuplier').value = item.namasuplier || '';
            document.getElementById('alamat').value = item.alamat || '';
            document.getElementById('alamatlengkap').value = item.alamatlengkap || '';
            document.getElementById('desa').value = item.desa || '';
            document.getElementById('kecamatan').value = item.kecamatan || '';
            document.getElementById('kabupaten').value = item.kabupaten || '';
            document.getElementById('propinsi').value = item.propinsi || '';
            document.getElementById('nomortelp').value = item.nomortelp || '';
            document.getElementById('namabank').value = item.namabank || '';
            document.getElementById('namadirekening').value = item.namadirekening || '';

            // Kosongkan Kolom Nomor Rekening untuk diisi no. rek baru
            document.getElementById('nomorrekening').value = '';

            if (!isSuperAdmin && currentUserIdsppg) {
                const inputIdsppg = document.getElementById('idsppg');
                inputIdsppg.value = currentUserIdsppg;
                inputIdsppg.readOnly = true;
                inputIdsppg.classList.add('readonly-locked');
                document.getElementById('infoIdsppg').style.display = 'block';
            } else {
                const inputIdsppg = document.getElementById('idsppg');
                inputIdsppg.readOnly = false;
                inputIdsppg.classList.remove('readonly-locked');
                document.getElementById('infoIdsppg').style.display = 'none';
            }

            modalFormInstance.show();
        }

        // 1. Fungsi Ambil Data dari Supabase
        async function fetchSuplierData() {
            const tbody = document.getElementById('tableSuplierBody');
            
            if (typeof _supabase === 'undefined') {
                showDebug("Objek '_supabase' tidak ditemukan.");
                return;
            }

            let query = _supabase
                .from('master_suplier')
                .select('*')
                .is('deleted_at', null);

            if (!isSuperAdmin) {
                if (currentUserIdsppg) {
                    query = query.eq('idsppg', currentUserIdsppg);
                } else {
                    query = query.eq('idsppg', 'TIDAK_ADA_AKSES');
                }
            }

            const { data, error } = await query;

            if (error) {
                showDebug(`Error Supabase: ${error.message}`);
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger py-4">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }

            semuaDataSuplier = data || [];
            
            // Urutkan berdasarkan idsuplier secara descending (bilangan bulat/string)
            semuaDataSuplier.sort((a, b) => (parseInt(b.idsuplier) || 0) - (parseInt(a.idsuplier) || 0));

            tampilkanDataKeTabel(semuaDataSuplier);
        }

        // 2. Fungsi Render / Tampilkan Data ke Tabel HTML
        function tampilkanDataKeTabel(data) {
            const tbody = document.getElementById('tableSuplierBody');
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">Tidak ada data suplier yang ditemukan untuk unit Anda.</td></tr>`;
                updateTombolAksiBawah();
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const displayIdsppg = item.idsppg || item.id_sppg || item.IDSppg || '-';
                
                html += `
                    <tr>
                        <td class="text-center">
                            <input type="checkbox" class="form-check-input check-item" value="${item.idsuplier}" onchange="updateTombolAksiBawah()">
                        </td>
                        <td>${index + 1}</td>
                        <td><span class="badge bg-light text-dark border">${item.idsuplier || '-'}</span></td>
                        <td><span class="fw-semibold text-primary">${displayIdsppg}</span></td>
                        <td class="fw-semibold">
                            <a href="javascript:void(0);" onclick="bukaModalEdit('${item.idsuplier}')" class="text-primary text-decoration-none" title="Klik untuk edit data">
                                ${item.namasuplier || '-'}
                            </a>
                        </td>
                        <td>${item.nomortelp || '-'}</td>
                        <td>${item.kabupaten || '-'}<br><small class="text-muted">${item.alamat || '-'}</small></td>
                        <td><small><b>Bank:</b> ${item.namabank || '-'}<br><b>No. Rek:</b> ${item.nomorrekening || '-'}<br><b>A/N:</b> ${item.namadirekening || '-'}</small></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="bukaModalEdit('${item.idsuplier}')" title="Edit Data">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="hapusSuplier('${item.idsuplier}')" title="Hapus Data">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            updateTombolAksiBawah();
        }

        // 3. Fungsi Filter / Pencarian
        function filterDataSuplier() {
            const keyword = document.getElementById('inputPencarian').value.toLowerCase();
            const hasilFilter = semuaDataSuplier.filter(item => {
                const nmsup = (item.namasuplier || '').toLowerCase();
                const idsup = (String(item.idsuplier) || '').toLowerCase();

                return nmsup.includes(keyword) || idsup.includes(keyword);
            });
            tampilkanDataKeTabel(hasilFilter);
        }

        function resetPencarian() {
            document.getElementById('inputPencarian').value = '';
            tampilkanDataKeTabel(semuaDataSuplier);
        }

        // 4. Fitur Pilih Semua (Check All)
        function pilihSemuaBaris(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.check-item');
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
            updateTombolAksiBawah();
        }

        // 5. Update Status Tombol Hapus Masal & Duplikasi
        function updateTombolAksiBawah() {
            const checkboxes = document.querySelectorAll('.check-item:checked');
            const btnHapus = document.getElementById('btnHapusMasal');
            const btnDuplikasi = document.getElementById('btnDuplikasi');
            const countSpan = document.getElementById('countTerpilih');
            
            const count = checkboxes.length;
            countSpan.textContent = count;

            if (count > 0) {
                btnHapus.removeAttribute('disabled');
            } else {
                btnHapus.setAttribute('disabled', 'true');
                document.getElementById('checkAll').checked = false;
            }

            if (count === 1) {
                btnDuplikasi.removeAttribute('disabled');
            } else {
                btnDuplikasi.setAttribute('disabled', 'true');
            }
        }

        // 6. Fungsi Hapus Satuan (Soft Delete)
        async function hapusSuplier(idsuplierStr) {
            if (confirm('Yakin ingin menghapus data suplier ini?')) {
                const waktuHapus = new Date().toISOString();
                const { error } = await _supabase
                    .from('master_suplier')
                    .update({ 
                        deleted_at: waktuHapus, 
                        deleted_by: currentUserNama 
                    })
                    .eq('idsuplier', idsuplierStr);

                if (error) {
                    alert('Gagal menghapus: ' + error.message);
                } else {
                    alert('Data suplier berhasil dihapus!');
                    fetchSuplierData();
                }
            }
        }

        // 7. Fungsi Hapus Masal (Bulk Soft Delete)
        async function hapusDataMasal() {
            const checkboxes = document.querySelectorAll('.check-item:checked');
            const idsToDelete = Array.from(checkboxes).map(cb => cb.value);

            if (idsToDelete.length === 0) return;

            if (confirm(`Yakin ingin menghapus ${idsToDelete.length} data suplier yang dipilih?`)) {
                const waktuHapus = new Date().toISOString();
                const { error } = await _supabase
                    .from('master_suplier')
                    .update({ 
                        deleted_at: waktuHapus, 
                        deleted_by: currentUserNama 
                    })
                    .in('idsuplier', idsToDelete);

                if (error) {
                    alert('Gagal menghapus data masal: ' + error.message);
                } else {
                    alert('Data suplier terpilih berhasil dihapus!');
                    document.getElementById('checkAll').checked = false;
                    fetchSuplierData();
                }
            }
        }

        // 8. Fungsi Simpan Data (Create / Update)
        document.getElementById('formSuplier').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpanSuplier');
            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            const idsuplierVal = document.getElementById('idsuplier').value.trim();

            const payload = {
                idsppg: document.getElementById('idsppg').value.trim(),
                namasuplier: document.getElementById('namasuplier').value.trim(),
                alamat: document.getElementById('alamat').value.trim(),
                alamatlengkap: document.getElementById('alamatlengkap').value.trim(),
                desa: document.getElementById('desa').value.trim(),
                kecamatan: document.getElementById('kecamatan').value.trim(),
                kabupaten: document.getElementById('kabupaten').value.trim(),
                propinsi: document.getElementById('propinsi').value.trim(),
                nomortelp: document.getElementById('nomortelp').value.trim(),
                namabank: document.getElementById('namabank').value.trim(),
                nomorrekening: document.getElementById('nomorrekening').value.trim(),
                namadirekening: document.getElementById('namadirekening').value.trim()
            };

            let error;

            if (isEditMode) {
                payload.edit_at = new Date().toISOString();
                payload.edit_by = currentUserNama;
                const res = await _supabase.from('master_suplier').update(payload).eq('idsuplier', idsuplierVal);
                error = res.error;
            } else {
                payload.idsuplier = idsuplierVal;
                payload.create_by = currentUserNama;
                const res = await _supabase.from('master_suplier').insert([payload]);
                error = res.error;
            }

            if (error) {
                alert('Gagal menyimpan: ' + error.message);
            } else {
                alert(isEditMode ? 'Berhasil memperbarui data suplier!' : 'Berhasil menyimpan data suplier!');
                modalFormInstance.hide();
                fetchSuplierData();
            }

            btn.disabled = false;
            btn.textContent = isEditMode ? 'Perbarui Data' : 'Simpan Data';
        });
    </script>
</body>
</html>
